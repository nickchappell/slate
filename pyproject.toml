[project]
name = "slate"
version = "1.1.0"
description = "Video image classifier Python CLI tool to add short descriptions to generically named raw video files from your camera"
authors = [
    { name = "Nick Chappell", email = "nick@intronic.org" }
]
requires-python = ">=3.14"
dependencies = [
    "mlx-vlm",
    "rich",
    "jinja2",
]

[project.scripts]
slate = "slate.cli:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises real ffmpeg/qlmanage/mlx-vlm against footage in tests/fixtures/footage/ (auto-skipped when empty)",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports/variables, etc.)
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern syntax)
    "B",   # flake8-bugbear (common bug patterns)
]

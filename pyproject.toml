[project]
name = "slate"
version = "1.4.0"
description = "Video image classifier Python CLI tool to add short descriptions to generically named raw video files from your camera"
authors = [
    { name = "Nick Chappell", email = "nick@intronic.org" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Personal-use tool, never published -- see "Deliberate Non-Goals" in
# CLAUDE.md. This classifier makes PyPI (and twine/uv publish) hard-refuse
# an upload, so an accidental `uv publish` can't leak it.
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.14"
# Lower bounds only -- uv.lock pins exact versions for `uv sync`, but
# `uv tool install .` resolves from here, not the lock, so without floors a
# tool install would accept arbitrarily old releases. Bump these to the
# locked versions whenever `make update` moves the floor meaningfully.
dependencies = [
    "mlx-vlm>=0.6.17",
    "rich>=15.0.0",
    "jinja2>=3.1.6",
]

[project.scripts]
slate = "slate.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Keep contributors on a uv that matches the pinned uv_build above.
required-version = ">=0.12,<0.13"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "integration: exercises real ffmpeg/qlmanage/mlx-vlm against footage in tests/fixtures/footage/ (auto-skipped when empty)",
]

[tool.coverage.run]
source = ["slate"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports/variables, etc.)
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern syntax)
    "B",   # flake8-bugbear (common bug patterns)
]
